<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<title>adtini · Quote Builder — keyword builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/adtini.css">
</head>
<body>

<header class="app">
  <div class="bar">
    <h1>adtini · SEO &amp; Rep Mgmt Quote Builder</h1>
    <span class="sub">adtini form — preview</span>
  </div>
  <nav class="tabs">
    <a href="/">SEO</a>
    <a href="/reputation">Reputation Mgmt</a>
    <a href="/adtini" class="on">adtini form</a>
  </nav>
</header>

<div class="pagehead">
  <span class="burger">&#9776;</span>
  <h2>Keyword Builder</h2>
</div>

<div class="wrap">
  <p class="crumbs">
    <a href="/adtini">Quotes</a> &rsaquo;
    <a href="/adtini/forecast">Forecast</a> &rsaquo;
    Keyword Builder <span id="forRow"></span>
  </p>

  <div class="kbgrid">

    <!-- seeds -->
    <section class="panel">
      <h4>Seed terms</h4>
      <p class="hint">What the client sells. Everything below is built from these.</p>
      <div class="box" data-chips="seeds"></div>
      <div class="kbrow">
        <div class="f"><label>Country</label>
          <select id="country">
            <option>United States</option><option>United Kingdom</option><option>Canada</option>
            <option>Australia</option><option>Ireland</option><option>New Zealand</option>
          </select></div>
        <div class="f"><label>Geo scope</label>
          <select id="scope">
            <option>Single City</option><option>Contiguous region</option>
            <option>Non-contiguous region</option><option>Statewide</option>
            <option selected>Nationwide</option>
          </select></div>
      </div>
      <button class="btn build" type="button" id="build">Build keyword list</button>
    </section>

    <!-- results -->
    <section class="panel">
      <div class="paneltop">
        <h4 id="listHead">Keyword list</h4>
        <label class="srctog"><input type="checkbox" id="showSrc"> sources</label>
      </div>
      <p class="hint" id="listNote">Nothing built yet.</p>
      <div class="cols" id="cols"></div>
      <div class="widen" id="widen" hidden></div>
    </section>

  </div>

  <div class="kbfoot">
    <span id="msg"></span>
    <a class="btn back" href="/adtini/forecast">&larr; Back to forecast</a>
    <button class="btn go" type="button" id="apply">Apply to forecast</button>
  </div>
</div>

<style>
.kbgrid{display:grid;grid-template-columns:360px 1fr;gap:20px;align-items:start}
@media(max-width:900px){.kbgrid{grid-template-columns:1fr}}
.panel{background:var(--card);border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(16,40,70,.08)}
.panel h4{margin:0 0 4px;font-size:15px;font-weight:600}
.paneltop{display:flex;align-items:center;gap:12px}
.paneltop h4{flex:1}
.srctog{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}
.srctog input{accent-color:var(--blue)}
.hint{margin:0 0 12px;color:var(--muted);font-size:12.5px}
.kbrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.kbrow .f{display:flex;flex-direction:column;gap:6px}
.kbrow label{font-size:12.5px;font-weight:600}
.kbrow select{background:var(--fill);border:0;border-radius:10px;padding:10px 12px;
  font-family:inherit;font-size:13px;width:100%}
.btn.build{background:var(--blue);width:100%;border-radius:10px;padding:12px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.col{background:var(--fill);border-radius:12px;padding:12px}
.col h5{margin:0 0 8px;font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between}
.col ul{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.col li{font-size:12.5px;display:flex;gap:6px;align-items:baseline}
.col li .v{color:var(--muted);font-size:11.5px;margin-left:auto;white-space:nowrap}
.col li .s{color:var(--blue);font-size:10px}
.widen{margin-top:16px;background:#FDF3E2;border-radius:12px;padding:14px 16px;font-size:12.5px}
.widen b{display:block;margin-bottom:8px}
.widen table{min-width:0;width:100%}
.widen td{padding:3px 0;border:0;font-size:12.5px}
.widen td:last-child{text-align:right;color:var(--muted)}
.kbfoot{display:flex;align-items:center;gap:12px;margin-top:20px}
.kbfoot #msg{margin-right:auto;color:var(--muted);font-size:12.5px}
.btn.back{background:var(--fill);color:var(--text);text-decoration:none;
  display:inline-flex;align-items:center;border-radius:10px;padding:11px 20px}
.kbfoot .btn.go{border-radius:10px;padding:11px 22px}
</style>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const row = new URLSearchParams(location.search).get('row');
if (row) $('forRow').textContent = '· ' + row;

const SEEDS = ['emergency dentist', 'dental implants', 'teeth whitening'];
const BUILT = {
  ultra: [['emergency dentist boca raton', 880, 'geo'], ['dental implants boca raton', 720, 'geo'],
          ['dentist near me', 480, 'ideas'], ['teeth whitening boca raton', 320, 'geo'],
          ['cosmetic dentist boca raton', 210, 'geo'], ['same day crowns', 170, 'ideas']],
  competitive: [['pediatric dentist boca raton', 140, 'geo'], ['invisalign boca raton', 110, 'geo'],
                ['root canal cost', 90, 'ideas'], ['dental bridge', 70, 'suggest'],
                ['tooth extraction', 70, 'ideas'], ['dentures boca raton', 50, 'geo'],
                ['wisdom teeth removal', 40, 'ideas'], ['dental crown cost', 30, 'suggest']],
  long_tail: [['how much do dental implants cost in florida', 40, 'suggest'],
              ['best emergency dentist open saturday', 20, 'gen'],
              ['does insurance cover teeth whitening', 10, 'gen'],
              ['what to expect at a root canal appointment', 10, 'gen']],
};
const LABEL = {ultra:'Ultra Competitive', competitive:'Competitive', long_tail:'Long Tail'};

function chipbox(box, list){
  box.innerHTML = list.map(v => `<span class="chip">${esc(v)} <b>&times;</b></span>`).join('')
    + '<input class="chipin" type="text" placeholder="add…" style="flex:1;min-width:110px;'
    + 'background:none;border:0;outline:none;font-family:inherit;font-size:13px;padding:2px;min-height:0">';
}
chipbox(document.querySelector('[data-chips="seeds"]'), SEEDS);

document.addEventListener('click', e => {
  const x = e.target.closest('.chip b');
  if (x) x.closest('.chip').remove();
  const box = e.target.closest('.box');
  if (box && !e.target.closest('.chip')) { const i = box.querySelector('.chipin'); if (i) i.focus(); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.classList.contains('chipin')) return;
  e.preventDefault();
  const v = e.target.value.trim();
  if (!v) return;
  e.target.insertAdjacentHTML('beforebegin', `<span class="chip">${esc(v)} <b>&times;</b></span>`);
  e.target.value = '';
});

function draw(){
  const src = $('showSrc').checked;
  $('cols').innerHTML = Object.keys(BUILT).map(k => `
    <div class="col">
      <h5>${LABEL[k]}<span>${BUILT[k].length}</span></h5>
      <ul>${BUILT[k].map(([t, v, s]) =>
        `<li><span>${esc(t)}</span>${src ? `<span class="s">[${s}]</span>` : ''}<span class="v">${v.toLocaleString()}</span></li>`
      ).join('')}</ul>
    </div>`).join('');
  const all = Object.values(BUILT).flat();
  const total = all.reduce((s, r) => s + r[1], 0);
  $('listHead').textContent = `Keyword list (${all.length} terms)`;
  $('listNote').textContent = `${total.toLocaleString()}/mo measured · ${$('country').value}`;
  $('widen').hidden = total >= 2000;
  $('widen').innerHTML = total >= 2000 ? '' :
    `<b>${total.toLocaleString()}/mo across ${all.length} measured terms.</b>
     <table><tr><td>dental marketing software</td><td>480</td></tr>
     <tr><td>patient scheduling software</td><td>210</td></tr>
     <tr><td>dental practice management</td><td>170</td></tr></table>`;
}

$('build').onclick = () => { draw(); $('msg').textContent = 'Built.'; };
$('showSrc').onchange = draw;
$('country').onchange = () => { if ($('cols').innerHTML) draw(); };
$('apply').onclick = () => {
  $('msg').textContent = 'Applied — returning to the forecast.';
  setTimeout(() => { location.href = '/adtini/forecast'; }, 500);
};
draw();
</script>
</body>
</html>
