<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<title>adtini · Quote Builder — quotes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/adtini.css">
</head>
<body>

<nav class="rail">
  <a href="/adtini" title="Home" aria-label="Home"><svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 3 3 10v11h6v-6h6v6h6V10z"/></svg></a>
  <div class="railnew">
    <button type="button" class="railbtn" id="railNew" title="New quote"
      aria-label="New quote" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 4h16v16H4z" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M11 8h2v3h3v2h-3v3h-2v-3H8v-2h3z"/></svg></button>
    <div class="newmenu railmenu" id="railMenu" hidden role="menu">
      <a href="/adtini/forecast?new=1&amp;product=seo" role="menuitem">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h10l4 4v14H6z" fill="none"
          stroke="currentColor" stroke-width="2"/><path d="M9 11h8v2H9zm0 4h5v2H9z"/></svg>
        SEO+</a>
      <a href="/adtini/forecast?new=1&amp;product=orm" role="menuitem">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4v6c0 5-3.5 7.5-8 8-4.5-.5-8-3-8-8V7z"
          fill="none" stroke="currentColor" stroke-width="2"/></svg>
        ORM</a>
    </div>
  </div>
  <a href="/adtini" title="Quotes" aria-label="Quotes" class="mark on">
    <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M6 3h10l4 4v14H6z" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M9 9h8v2H9zm0 4h8v2H9zm0 4h5v2H9z"/></svg></a>
  <a href="/" title="Legacy quote builder" aria-label="Legacy quote builder" class="legacy">
    <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 8a4 4 0 100 8 4 4 0 000-8zm0 2a2 2 0 110 4 2 2 0 010-4z"/>
    <path d="M11 2h2l.4 2.6 1.9.8 2.1-1.5 1.4 1.4-1.5 2.1.8 1.9L22 11v2l-2.6.4-.8 1.9 1.5 2.1-1.4 1.4-2.1-1.5-1.9.8L13 22h-2l-.4-2.6-1.9-.8-2.1 1.5-1.4-1.4 1.5-2.1-.8-1.9L2 13v-2l2.6-.4.8-1.9L3.9 6.6l1.4-1.4 2.1 1.5 1.9-.8z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></a>
</nav>

<div class="pagehead">
  <span class="burger">&#9776;</span>
  <h2>Quotes</h2>
  <span class="build">{{ build }}</span>
  <div class="newq">
    <button class="btn-create" type="button" id="newQ" aria-haspopup="true"
      aria-expanded="false">&#43; New quote</button>
    <div class="newmenu" id="newMenu" hidden role="menu">
      <a href="/adtini/forecast?new=1&amp;product=seo" role="menuitem">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h10l4 4v14H6z" fill="none"
          stroke="currentColor" stroke-width="2"/><path d="M9 11h8v2H9zm0 4h5v2H9z"/></svg>
        SEO+</a>
      <a href="/adtini/forecast?new=1&amp;product=orm" role="menuitem">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4v6c0 5-3.5 7.5-8 8-4.5-.5-8-3-8-8V7z"
          fill="none" stroke="currentColor" stroke-width="2"/></svg>
        ORM</a>
    </div>
  </div>
</div>

<div class="wrap">

  <div class="controls">
    <div class="search">
      <span>&#9906;</span>
      <input type="text" id="q" placeholder="Search quotes…">
    </div>
    <button class="btn-cat" type="button">&#9638; Categories</button>
    <div class="seg" id="seg">
      <button type="button" class="on" data-f="all">&#10003; All</button>
      <button type="button" data-f="seo">SEO</button>
      <button type="button" data-f="orm">ORM</button>
      <button type="button" data-f="both">Both products</button>
    </div>
  </div>

  <div class="tablecard">
    <div class="scroller">
      <table>
        <thead>
          <tr>
            <th style="width:40px"></th>
            <th>Planner</th>
            <th>Built</th>
            <!-- Order ID is a short number and was taking a full column's width;
                 Partner reads better beside Strategies than between Built and
                 the order number. -->
            <th style="width:92px">Order ID</th>
            <th>Client</th>
            <th>Products</th>
            <th>Strategies</th>
            <th>Partner</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="pager">
      <span>Items per page:</span>
      <select id="per"><option>10</option><option>25</option><option>50</option><option>100</option></select>
      <span id="count">0 of 0</span>
      <span class="arrows"><span data-go="first" title="First page">&#8676;</span><span data-go="prev" title="Previous page">&#8592;</span><span data-go="next" title="Next page">&#8594;</span><span data-go="last" title="Last page">&#8677;</span></span>
    </div>
  </div>

</div>


<script>
// A CLIENT IS ONE ROW, WHATEVER IT BOUGHT. Two products on one client merge
// into a single row and the Products column carries both chips; a superscript
// is how many separate saved quotes that product has, which is also how many
// rows that client's forecast page shows.
// PLANNER, PARTNER AND STATUS ARE EDITED HERE. They belong to the client, not
// to a run, so they are set on this page and every quote on that client
// inherits them. Strategies are read off the products -- what the quote is
// actually buying.
const PLANNERS = ['Kiri', 'Stacy', 'Hana', 'Megan', 'SSG'];
const STATUSES = ['Pending', 'In Progress', 'Ready for SSG Review', 'Complete'];
const TONE = {
  Kiri:   '#12294F,#D8E4F7',
  Stacy:  '#1E4620,#D6F2E0',
  Hana:   '#5B1E4A,#F7D6EC',
  Megan:  '#5C2A12,#FBDCC8',
  SSG:    '#33265C,#E2DCF7',
};
const QUOTES = [
  {planner:'Kiri', built:'9/17/26', due:'ok', client:'Drainify', order:'',
   seo:2, orm:0, seoStrat:['Core SEO','AI Search'], ormStrat:[],
   partner:'ADX Communications', status:'In Progress'},
  {planner:'Kiri', built:'9/17/26', due:'ok', client:'Ski Barn', order:'',
   seo:0, orm:2, seoStrat:[], ormStrat:['Review Removals','Reactive'],
   partner:'Rock Paper Scissors', status:'Pending'},
  {planner:'Kiri', built:'9/16/26', due:'warn', client:'Sage Dental', order:'',
   seo:1, orm:1, seoStrat:['Core SEO'],
   ormStrat:['Review Removals','Site/Article Removals','Reactive','Proactive'],
   partner:'Bay Area Digital Solutions', status:'Ready for SSG Review'},
  {planner:'Kiri', built:'9/16/26', due:'warn', client:"Rosalyn's Ice Cream", order:'',
   seo:1, orm:0, seoStrat:['Core SEO'], ormStrat:[],
   partner:'Local Media San Diego', status:'Pending'},
  {planner:'Kiri', built:'9/15/26', due:'ok', client:'Renfroe Pecans', order:'',
   seo:1, orm:0, seoStrat:['Core SEO','AI Search'], ormStrat:[],
   partner:'ADX Communications', status:'In Progress'},
  {planner:'Kiri', built:'9/15/26', due:'ok', client:'Junk Bee Gone', order:'',
   seo:1, orm:3, seoStrat:['Core SEO'], ormStrat:['Review Removals','Proactive'],
   partner:'Amperage Marketing + Fundraising', status:'Ready for SSG Review'},
  {planner:'Kiri', built:'9/12/26', due:'warn', client:'Visions Electronics', order:'',
   seo:0, orm:1, seoStrat:[], ormStrat:['Reactive'],
   partner:'Benchmarketing Group', status:'Complete'},
  {planner:'Kiri', built:'9/11/26', due:'ok', client:'Whidbey Island Electric', order:'',
   seo:1, orm:0, seoStrat:['Core SEO'], ormStrat:[],
   partner:'CK Advertising Strategies', status:'Complete'},
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tag = (cls, label, n) =>
  `<span class="tag ${cls}">${label}${n > 1 ? '<sup>' + n + '</sup>' : ''}</span>`;

// The sparkle opens the client's quote builder.
// The order rides along only when the client has one. An empty &order= is a
// number nobody entered.
const fcUrl = (r, product) => '/adtini/forecast?client=' + encodeURIComponent(r.client)
  + (r.order ? '&order=' + encodeURIComponent(r.order) : '')
  + (product ? '&review=' + product : '');

function pick(list, val, cls, i, field){
  return `<select class="${cls}" data-i="${i}" data-f="${field}">`
    + list.map(v => `<option${v === val ? ' selected' : ''}>${esc(v)}</option>`).join('')
    + '</select>';
}

// TEN TO A PAGE. The pager was drawn and did nothing: every quote on one
// page, "1 - 8 of 8" hardcoded. A search or a filter starts back at page one.
let PAGE = 1, PER = 10;
function draw(){
  const f = document.querySelector('#seg button.on').dataset.f;
  const term = (document.getElementById('q').value || '').toLowerCase();
  const all = QUOTES.map((r, i) => [r, i]).filter(([r]) => {
    if (f === 'seo'  && !r.seo) return false;
    if (f === 'orm'  && !r.orm) return false;
    if (f === 'both' && !(r.seo && r.orm)) return false;
    if (term && !(r.client + ' ' + r.partner + ' ' + r.order).toLowerCase().includes(term)) return false;
    return true;
  });
  const pages = Math.max(1, Math.ceil(all.length / PER));
  PAGE = Math.max(1, Math.min(pages, PAGE));
  const start = (PAGE - 1) * PER;
  const rows = all.slice(start, start + PER);
  document.getElementById('rows').innerHTML = rows.map(([r, i]) => {
    const [fg, bg] = (TONE[r.planner] || TONE.Kiri).split(',');
    const chips = (r.seo ? tag('seo', 'SEO', r.seo) : '') + (r.orm ? tag('orm', 'ORM', r.orm) : '');
    const strat = [...new Set((r.seoStrat || []).concat(r.ormStrat || []))]
      .map(v => `<span class="strat">${esc(v)}</span>`).join('') || '—';
    return `<tr>
      <td><div class="rowicons">
        <a href="${fcUrl(r)}" title="Quote builder — ${esc(r.client)}" class="spark">&#10022;</a>
      </div></td>
      <td>${pick(PLANNERS, r.planner, 'who sel', i, 'planner')
        .replace('class="who sel"', `class="who sel" style="color:${fg};background:${bg}"`)}</td>
      <td><span class="due${r.due === 'warn' ? ' warn' : ''}">${r.built}</span></td>
      <td><input class="cell ord" data-i="${i}" data-f="order_no" value="${esc(r.order || '')}"
                 placeholder="\u2014"></td>
      <td class="lnk"><a href="${fcUrl(r)}">${esc(r.client)}</a></td>
      <td><div class="tags">${chips}</div></td>
      <td><div class="tags">${strat}</div></td>
      <td><input class="cell" data-i="${i}" data-f="partner" value="${esc(r.partner)}"></td>
      <td>${pick(STATUSES, r.status, 'stat sel', i, 'status')}</td>
    </tr>`;
  }).join('');
  document.getElementById('count').textContent = all.length
    ? `${start + 1} – ${start + rows.length} of ${all.length}` : '0 of 0';
  document.querySelectorAll('.pager .arrows span').forEach(a => {
    const go = a.dataset.go;
    const dead = (go === 'first' || go === 'prev') ? PAGE <= 1 : PAGE >= pages;
    a.style.opacity = dead ? '.35' : '';
    a.style.cursor = dead ? 'default' : 'pointer';
  });
}
document.querySelector('.pager .arrows').addEventListener('click', e => {
  const a = e.target.closest('[data-go]');
  if (!a) return;
  const go = a.dataset.go;
  if (go === 'first') PAGE = 1;
  else if (go === 'prev') PAGE -= 1;
  else if (go === 'next') PAGE += 1;
  else PAGE = 1e9;
  draw();
});
document.getElementById('per').addEventListener('change', e => {
  PER = Math.max(1, +e.target.value || 10);
  PAGE = 1;
  draw();
});

// An edit belongs to the client and sticks -- the same planner, partner and
// status show on every quote that client has.
// An edit belongs to the client and sticks -- the same planner, partner and
// status show on every quote that client has.
document.getElementById('rows').addEventListener('change', async e => {
  const el = e.target.closest('[data-f]');
  if (!el) return;
  const r = QUOTES[+el.dataset.i];
  r[el.dataset.f === 'order_no' ? 'order' : el.dataset.f] = el.value;
  if (el.dataset.f === 'planner') draw();
  if (!LIVE) return;
  try {
    await fetch('/api/adtini/client_meta', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({client: r.client, [el.dataset.f]: el.value})});
  } catch (err) { /* the row keeps the edit; the next load will show the truth */ }
});

// THE SAMPLE ROWS ARE A FALLBACK, NOT THE PAGE. With a database attached the
// list is the clients that have saved quotes.
let LIVE = false;
async function loadClients(){
  let d = null;
  try { d = await (await fetch('/api/adtini/clients')).json(); } catch (e) { return; }
  if (!d || !d.enabled || !(d.clients || []).length) return;
  LIVE = true;
  QUOTES.length = 0;
  d.clients.forEach(c => QUOTES.push(Object.assign({due: 'ok'}, c)));
  draw();
}
loadClients();

// A NEW QUOTE IS A PRODUCT FIRST. The two products ask for different things, so
// the choice is made here rather than on a form that has to be both.
const nq = document.getElementById('newQ'), nm = document.getElementById('newMenu');
nq.addEventListener('click', e => {
  e.stopPropagation();
  nm.hidden = !nm.hidden;
  nq.setAttribute('aria-expanded', String(!nm.hidden));
});
document.addEventListener('click', () => {
  if (!nm.hidden) { nm.hidden = true; nq.setAttribute('aria-expanded', 'false'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') nm.hidden = true; });

document.getElementById('seg').addEventListener('click', e => {
  const b = e.target.closest('button[data-f]');
  if (!b) return;
  document.querySelectorAll('#seg button').forEach(x => {
    x.classList.toggle('on', x === b);
    x.innerHTML = (x === b ? '&#10003; ' : '') + x.dataset.f
      .replace('all', 'All').replace('seo', 'SEO').replace('orm', 'ORM')
      .replace('both', 'Both products');
  });
  PAGE = 1;
  draw();
});
document.getElementById('q').addEventListener('input', () => { PAGE = 1; draw(); });
draw();

// THE RAIL'S + IS THE SAME CHOICE AS THE BUTTON ON THE QUOTES PAGE. It went
// straight to a blank form that had to be both products at once.
(function(){
  const b = document.getElementById('railNew'), m = document.getElementById('railMenu');
  if (!b || !m) return;
  b.addEventListener('click', e => {
    e.stopPropagation();
    m.hidden = !m.hidden;
    b.setAttribute('aria-expanded', String(!m.hidden));
  });
  document.addEventListener('click', () => {
    if (!m.hidden) { m.hidden = true; b.setAttribute('aria-expanded', 'false'); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !m.hidden) { m.hidden = true; b.setAttribute('aria-expanded', 'false'); }
  });
})();
</script>
</body>
</html>
